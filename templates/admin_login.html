<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h2 {
            text-align: center;
            margin-bottom: 10px;
        }
        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }
        label {
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #ee5a52;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🔐 Admin Login</h2>
    <p>Enter admin credentials</p>

    <!-- 🔴 DO NOT ADD JAVASCRIPT -->
    <form method="POST" action="/api/admin-login-submit">
        <label>Admin Email</label>
        <input type="email" name="adminEmail" required>

        <label>Password</label>
        <input type="password" name="adminPassword" required>

        <button type="submit">Login to Dashboard</button>
    </form>
</div>

</body>
</html>
