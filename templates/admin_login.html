<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<style>
body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.box{
    background:white;
    padding:40px;
    border-radius:16px;
    width:380px;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
}
h2{text-align:center;margin-bottom:10px}
p{text-align:center;color:#666;margin-bottom:25px}
input{
    width:100%;
    padding:14px;
    margin-bottom:16px;
    border-radius:10px;
    border:1px solid #ccc;
}
button{
    width:100%;
    padding:14px;
    background:#ef4444;
    border:none;
    color:white;
    font-size:16px;
    border-radius:12px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="box">
    <h2>🔐 Admin Login</h2>
    <p>Enter admin credentials</p>

    <form method="POST" action="/api/admin-login-submit">
        <input type="email" name="adminEmail" placeholder="Admin Email" required>
        <input type="password" name="adminPassword" placeholder="Password" required>
        <button type="submit">Login to Dashboard</button>
    </form>
</div>

</body>
</html>
